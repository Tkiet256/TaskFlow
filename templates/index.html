<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
    window.dbTasks = {{ tasks | tojson }};
</script>
<script src="{{ url_for('static', filename='scripts.js') }}" defer></script>

<body>  
    <div class="app-shell" id="top">
        <aside class="sidebar">
            <a href="#top" class="brand">
                <i data-lucide="list-checks" class="nav-icon-top"></i>
                <span>Task<span class="brand-accent">Flow</span></span>
            </a>

            {# <section class="sidebar-card pages-card">
                <h3>Pages</h3>

                <a class="nav-item {{ 'active' if request.endpoint == 'dashboard' else '' }}"
                href="{{ url_for('dashboard') }}">
                    <i data-lucide="layout-dashboard" class="nav-icon"></i>
                    <span>Dashboard</span>
                </a>

                <a class="nav-item {{ 'active' if request.endpoint == 'index' else '' }}"
                href="{{ url_for('index') }}">
                    <i data-lucide="calendar-days" class="nav-icon"></i>
                    <span>Calendar</span>
                </a>

                <a class="nav-item {{ 'active' if request.endpoint == 'settings' else '' }}"
                href="{{ url_for('settings') }}">
                    <i data-lucide="settings" class="nav-icon"></i>
                    <span>Setting</span>
                </a>

                <a class="nav-item {{ 'active' if request.endpoint == 'help_page' else '' }}"
                href="{{ url_for('help_page') }}">
                    <i data-lucide="circle-help" class="nav-icon"></i>
                    <span>Help</span>
                </a>
            </section> #}

            <section class="sidebar-card events-card">
                <h3>Events in-day</h3>
                <div id="event-list" class="event-list"></div>
                <p id="empty-events" class="empty-events" hidden>
                    No tasks for this day
                </p>
            </section>

            <section class="sidebar-card progress-card">
                <h3>Progress</h3>
                <div id="progress-number" class="progress-number">0%</div>
                <div class="progress-track">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
                <div id="progress-caption" class="progress-caption">
                    0/0 tasks done
                </div>
            </section>

            <div class="sidebar-profile">
                <div class="profile-avatar">TK</div>
                <div class="profile-info">
                    <span class="profile-name">Tuan Kiet</span>
                    <span class="profile-status">Personal workspace</span>
                </div>
                <button type="button" class="profile-menu" aria-label="Account options">
                    ⋯
                </button>
            </div>
        </aside>

        <main class="main-content">
        <header class="topbar">
            <h1 class="greeting">Hi, Tuan Kiet</h1>

            <div class="topbar-actions">
                <div class="date-controls">
                    <button class="nav-btn" id="prev-week">‹</button>
                    <button class="today-btn" id="today">Today</button>
                    <button class="nav-btn" id="next-week">›</button>
                </div>

            <div class="view-controls">
                <button type="button" id="day-view-btn">Day</button>
                <button type="button" id="week-view-btn" class="active">Week</button>
                <button type="button" id="month-view-btn">Month</button>
            </div>

                <button type="button" id="topbar-add-task" class="add-task-btn">+ Add task</button>
            </div>
        </header>

            
        <div class="calendar">

            <!-- DAY VIEW -->
            <div id="day-view" hidden>
                <!-- Sẽ triển khai sau -->
            </div>

            <!-- WEEK VIEW -->
            <div id="week-view">
                <div class="week-header" id="week-header"></div>

                <div class="calendar-scroll" id="calendar-scroll">
                    <div class="time-labels" id="time-labels"></div>

                    <div class="calendar-body" id="calendar-body">
                        <div class="current-time-line" id="current-time-line">
                            <span class="current-time-dot"></span>
                            <span
                                class="current-time-label"
                                id="current-time-label"
                            ></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- MONTH VIEW -->
            <div id="month-view" hidden>
                <h2 id="month-title"></h2>

                <div class="month-weekdays">
                    <div>Monday</div>
                    <div>Tuesday</div>
                    <div>Wednesday</div>
                    <div>Thursday</div>
                    <div>Friday</div>
                    <div>Saturday</div>
                    <div>Sunday</div>
                </div>

                <div id="month-grid" class="month-grid"></div>
            </div>

        </div>
        <div id="task-modal" class="task-modal" hidden>
            <form action="{{ url_for('add_task') }}" method="POST" class="task-form">
                <h2>Add new task</h2>

                <label for="task-title">Task name</label>
                <input
                    type="text"
                    id="task-title"
                    name="title"
                    placeholder="Enter task name"
                    required
                >

                <label for="task-description">Description</label>
                <textarea
                    id="task-description"
                    name="description"
                    placeholder="Enter description"
                ></textarea>

                <label for="task-priority">Priority</label>
                <select id="task-priority" name="priority">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>

                <label for="task-due-date">Due date</label>
                <input type="date" id="task-due-date" name="due_date" required>
                <label for="task-start-time">Start time</label>
                <input
                    type="time"
                    id="task-start-time"
                    name="start_time"
                    required
                >

                <label for="task-end-time">End time</label>
                <input
                    type="time"
                    id="task-end-time"
                    name="end_time"
                    required
                >

                <label for="task-link">Meeting / Resource link</label>
                <input
                    type="url"
                    id="task-link"
                    name="link"
                    placeholder="https://..."
                >
                <div class="task-form-actions">
                    <button type="button" id="cancel-task">Cancel</button>
                    <button type="submit" class="add-task-btn">Save task</button>
                </div>
            </form>
        </div>
        </main>
    </div>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
