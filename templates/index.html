<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<script src="https://unpkg.com/lucide@latest"></script>
<script>

document.addEventListener("DOMContentLoaded", function () {
    let currentView = "week";
    const dbTasks = {{ tasks | tojson }};
    const labels = document.getElementById("time-labels");
    const body = document.getElementById("calendar-body");
    const line = document.getElementById("current-time-line");
    const weekHeader = document.getElementById("week-header");
    const timeLabel = document.getElementById("current-time-label");
    const eventList = document.getElementById("event-list");
    const progressNumber = document.getElementById("progress-number");
    const progressFill = document.getElementById("progress-fill");
    const progressCaption = document.getElementById("progress-caption");
    const emptyEvents = document.getElementById("empty-events");
    const addTaskButton = document.getElementById("topbar-add-task");

    if (!labels || !body || !line || !weekHeader) {
        console.error("Không tìm thấy phần tử lịch. Kiểm tra lại ID trong HTML!");
        return;
    }

    const HOUR_HEIGHT = 60;
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let selectedDate = new Date(today);
    let weekOffset = 0;

    const dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

    function dateKey(date) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function isSameDay(a, b) {
        return dateKey(a) === dateKey(b);
    }

    // Tạo nhãn giờ, tránh tạo trùng
    labels.replaceChildren();

    for (let hour = 0; hour < 24; hour++) {
        const label = document.createElement("div");
        label.className = "time-label";
        label.textContent = `${String(hour).padStart(2, "0")}:00`;
        labels.appendChild(label);
    }


    function renderWeek() {
        weekHeader.replaceChildren();

        const timezone = document.createElement("div");
        timezone.className = "timezone";
        timezone.textContent = "GMT+7";
        weekHeader.appendChild(timezone);

        // Xóa các cột cũ nhưng giữ lại đường thời gian hiện tại
        body.replaceChildren(line);

        // Xác định ngày thứ Hai đầu tuần
        const start = new Date(today);
        const dayOffset = (start.getDay() + 6) % 7;
        start.setDate(start.getDate() - dayOffset + weekOffset * 7);

        // Tạo 7 ngày trong tuần
        for (let i = 0; i < 7; i++) {
            const date = new Date(start);
            date.setDate(start.getDate() + i);

            const isToday = isSameDay(date, today);
            const isSelected = isSameDay(date, selectedDate);

            // Tạo header ngày
            const header = document.createElement("button");
            header.type = "button";
            header.className = "day-header";

            if (isToday) header.classList.add("is-today");
            if (isSelected) header.classList.add("is-selected");

            const top = document.createElement("div");
            top.className = "day-top";

            const name = document.createElement("span");
            name.className = "day-name";
            name.textContent = dayNames[date.getDay()];

            const number = document.createElement("span");
            number.className = "day-number";
            number.textContent = date.getDate();

            top.append(name, number);
            header.appendChild(top);

            if (isToday) {
                const indicator = document.createElement("span");
                indicator.className = "today-indicator";
                header.appendChild(indicator);
            }

            if (isSelected) {
                const caption = document.createElement("span");
                caption.className = "day-count";
                caption.textContent = "Selected";
                header.appendChild(caption);
            }

            header.addEventListener("click", function () {
                selectedDate = new Date(date);
                renderWeek();
                renderSidebarTasks();
            });

            weekHeader.appendChild(header);

            // Tạo cột lịch
            const column = document.createElement("div");
            column.className = "day-column";
            column.dataset.date = dateKey(date);

            if (isSelected) {
                column.classList.add("is-selected");
            } else {
                column.classList.add("is-dimmed");
            }

            body.appendChild(column);

            // Lấy task của ngày hiện tại
            const dayTasks = dbTasks.filter(
                task => task.due_date === dateKey(date)
            );

            dayTasks.forEach(task => {
                if (!task.start_time || !task.end_time) return;

                const [startHour, startMinute] =
                    task.start_time.split(":").map(Number);

                const [endHour, endMinute] =
                    task.end_time.split(":").map(Number);

                const startMinutes = startHour * 60 + startMinute;
                const endMinutes = endHour * 60 + endMinute;

                if (endMinutes <= startMinutes) return;

                const event = document.createElement("div");
                event.className = "calendar-event";

                event.style.top = `${startMinutes}px`;
                event.style.height =
                    `${endMinutes - startMinutes}px`;

                const colors = [
                    "#fecaca", "#a5eaf2", "#bbf7a8",
                    "#c4b5fd", "#fed7aa", "#fbcfe8"
                ];

                event.style.backgroundColor =
                    colors[Math.abs(Number(task.id) || 0) % colors.length];

                if (Boolean(task.completed)) {
                    event.classList.add("is-completed");
                }

                const title = document.createElement("div");
                title.className = "calendar-event-title";
                title.textContent = task.title;

                const time = document.createElement("div");
                time.className = "calendar-event-time";
                time.textContent =
                    `◷ ${task.start_time} - ${task.end_time}`;

                event.append(title, time);

                // Hiển thị mô tả công việc
                if (task.description && task.description.trim()) {
                    const description = document.createElement("div");
                    description.className = "calendar-event-description";
                    description.textContent = task.description;
                    event.appendChild(description);
                }

                if (task.link) {
                    const link = document.createElement("a");
                    link.className = "calendar-event-link";
                    link.href = task.link;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "↗ Open link";

                    link.addEventListener("click", function (e) {
                        e.stopPropagation();
                    });

                    event.appendChild(link);
                }

                column.appendChild(event);
            });
        }

        updateCurrentTime();
    }

    
    function renderDay() {
        weekHeader.replaceChildren();
        body.replaceChildren(line);

        // Day View chỉ có một cột ngày
        body.style.gridTemplateColumns = "minmax(0, 1fr)";

        const timezone = document.createElement("div");
        timezone.className = "timezone";
        timezone.textContent = "GMT+7";
        weekHeader.appendChild(timezone);

        const date = new Date(selectedDate);
        const isToday = isSameDay(date, today);

        // Tiêu đề ngày
        const header = document.createElement("button");
        header.type = "button";
        header.className = "day-header";

        if (isToday) header.classList.add("is-today");

        const top = document.createElement("div");
        top.className = "day-top";

        const name = document.createElement("span");
        name.className = "day-name";
        name.textContent = dayNames[date.getDay()];

        const number = document.createElement("span");
        number.className = "day-number";
        number.textContent = date.getDate();

        top.append(name, number);
        header.appendChild(top);

        if (isToday) {
            const indicator = document.createElement("span");
            indicator.className = "today-indicator";
            header.appendChild(indicator);
        }

        weekHeader.appendChild(header);

        // Cột lịch của ngày đang chọn
        const column = document.createElement("div");
        column.className = "day-column";
        column.dataset.date = dateKey(date);
        body.appendChild(column);

        // Lấy các task có ngày trùng với ngày đang chọn
        const dayTasks = dbTasks.filter(
            task => task.due_date === dateKey(date)
        );

        const colors = [
            "#fecaca", "#a5eaf2", "#bbf7a8",
            "#c4b5fd", "#fed7aa", "#fbcfe8"
        ];

        dayTasks.forEach(task => {
            if (!task.start_time || !task.end_time) return;

            const [startHour, startMinute] =
                task.start_time.split(":").map(Number);

            const [endHour, endMinute] =
                task.end_time.split(":").map(Number);

            const startMinutes = startHour * 60 + startMinute;
            const endMinutes = endHour * 60 + endMinute;

            if (
                endMinutes <= startMinutes ||
                startMinutes < 0 ||
                endMinutes > 24 * 60
            ) return;

            const event = document.createElement("div");
            event.className = "calendar-event";
            event.style.top = `${startMinutes}px`;
            event.style.height = `${endMinutes - startMinutes}px`;
            event.style.backgroundColor =
                colors[Math.abs(Number(task.id) || 0) % colors.length];

            if (Boolean(task.completed)) {
                event.classList.add("is-completed");
            }

            const title = document.createElement("div");
            title.className = "calendar-event-title";
            title.textContent = task.title;

            const time = document.createElement("div");
            time.className = "calendar-event-time";
            time.textContent =
                `◷ ${task.start_time} - ${task.end_time}`;

            event.append(title, time);

            if (task.link) {
                const link = document.createElement("a");
                link.className = "calendar-event-link";
                link.href = task.link;
                link.target = "_blank";
                link.rel = "noopener noreferrer";
                link.textContent = "↗ Open link";

                link.addEventListener("click", e => {
                    e.stopPropagation();
                });

                event.appendChild(link);
            }

            column.appendChild(event);
        });

        // Chỉ hiện vạch thời gian hiện tại nếu đang xem hôm nay
        updateCurrentTime();
        line.style.display = isToday ? "block" : "none";
    }



    function updateCurrentTime() {
        const parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: "Asia/Ho_Chi_Minh",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        }).formatToParts(new Date());

        const get = type =>
            Number(parts.find(p => p.type === type).value);

        const hour = get("hour");
        const minute = get("minute");
        const second = get("second");

        const top =
            (hour * 60 + minute + second / 60) *
            (HOUR_HEIGHT / 60);

        line.style.top = `${top}px`;

        if (timeLabel) {
            timeLabel.textContent =
                `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
        }

        // Chỉ hiện đường giờ hiện tại trong tuần chứa hôm nay
        const start = new Date(today);
        start.setDate(start.getDate() - (start.getDay() + 6) % 7);

        const end = new Date(start);
        end.setDate(end.getDate() + 7);

        line.style.display =
            weekOffset === 0 ? "block" : "none";
    }

    renderWeek();
    setInterval(updateCurrentTime, 1000);
    // Lưu riêng từng ngày trong trình duyệt.
    const STORAGE_KEY = "taskflow_tasks";

    function getTasks() {
        try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        } catch {
            return {};
        }
    }

    function saveTasks(tasks) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function selectedDateKey() {
        const year = selectedDate.getFullYear();
        const month = String(selectedDate.getMonth() + 1).padStart(2, "0");
        const day = String(selectedDate.getDate()).padStart(2, "0");

        return `${year}-${month}-${day}`;
    }

    function renderSidebarTasks() {
        const key = selectedDateKey();

        // Lấy task của ngày đang chọn từ SQLite
        const tasks = dbTasks.filter(task => task.due_date === key);

        eventList.replaceChildren();

        tasks.forEach(task => {
            const label = document.createElement("label");
            label.className = "event-item";

            // Checkbox Complete
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = Boolean(task.completed);

            // Tên task
            const title = document.createElement("span");
            title.textContent = task.title;

            // Cập nhật trạng thái Complete lên SQLite
            checkbox.addEventListener("change", async function () {
                const newStatus = checkbox.checked;

                try {
                    const response = await fetch(
                        `/tasks/${task.id}/toggle`,
                        { method: "POST" }
                    );

                    if (!response.ok) {
                        throw new Error("Không thể cập nhật task");
                    }

                    // Cập nhật dữ liệu trên giao diện
                    task.completed = newStatus;
                    // Render lại calendar
                    renderWeek();
                    renderMonth();
                    // Cập nhật Progress
                    updateProgressForCurrentView();

                } catch (error) {
                    console.error(error);
                    checkbox.checked = !newStatus;
                    alert("Không thể cập nhật trạng thái task!");
                }
            });

            // Nút Delete
            const deleteForm = document.createElement("form");
            deleteForm.method = "POST";
            deleteForm.action = `/tasks/${task.id}/delete`;

            const deleteButton = document.createElement("button");
            deleteButton.type = "submit";
            deleteButton.className = "delete-task-btn";
            deleteButton.textContent = "🗑";

            deleteForm.addEventListener("submit", function (e) {
                if (!confirm("Bạn có chắc muốn xóa task này?")) {
                    e.preventDefault();
                }
            });

            deleteForm.appendChild(deleteButton);

            label.append(checkbox, title, deleteForm);
            eventList.appendChild(label);
        });

        emptyEvents.hidden = tasks.length !== 0;

        // Cập nhật Progress ngay khi render
        updateProgressForCurrentView();
    }


    const dayViewBtn = document.getElementById("day-view-btn");
    const weekViewBtn = document.getElementById("week-view-btn");
    const monthViewBtn = document.getElementById("month-view-btn");

    function switchView(view) {
        currentView = view;

        dayView.hidden = true;
        weekView.hidden = true;
        monthView.hidden = true;

        dayViewBtn.classList.toggle("active", view === "day");
        weekViewBtn.classList.toggle("active", view === "week");
        monthViewBtn.classList.toggle("active", view === "month");

        if (view === "day") {
            weekView.hidden = false;
            renderDay();
        } else if (view === "week") {
            weekView.hidden = false;
            body.style.gridTemplateColumns = "";
            renderWeek();
        } else if (view === "month") {
            monthView.hidden = false;
            renderMonth();
        }

        renderSidebarTasks();
    }

    dayViewBtn.addEventListener("click", () => switchView("day"));
    weekViewBtn.addEventListener("click", () => switchView("week"));
    monthViewBtn.addEventListener("click", () => switchView("month"));


    function updateProgress(tasks) {
        const total = tasks.length;

        const completed = tasks.filter(
            task => Boolean(task.completed)
        ).length;

        const percent = total === 0
            ? 0
            : Math.round((completed / total) * 100);

        progressNumber.textContent = `${percent}%`;
        progressFill.style.width = `${percent}%`;

        progressCaption.textContent =
            `${completed}/${total} tasks done`;
    }

    function updateProgressForCurrentView() {
        let progressTasks;

        if (currentView === "month") {
            // Lấy toàn bộ task thuộc tháng đang hiển thị
            const year = displayedMonth.getFullYear();
            const month = String(displayedMonth.getMonth() + 1)
                .padStart(2, "0");

            const monthPrefix = `${year}-${month}-`;

            progressTasks = dbTasks.filter(task =>
                task.due_date &&
                task.due_date.startsWith(monthPrefix)
            );
        } else {
            // Day/Week hiện tại: tính theo ngày đang chọn
            const progressDate = selectedDateKey();

            progressTasks = dbTasks.filter(task =>
                task.due_date === progressDate
            );
        }

        updateProgress(progressTasks);
    }

    // Hiển thị công việc của ngày hiện tại khi mở trang.
    renderSidebarTasks();
    const topbarAddTask = document.getElementById("topbar-add-task");
    const taskModal = document.getElementById("task-modal");
    const cancelTask = document.getElementById("cancel-task");
    const taskDueDate = document.getElementById("task-due-date");

    topbarAddTask.addEventListener("click", function () {
        const year = selectedDate.getFullYear();
        const month = String(selectedDate.getMonth() + 1).padStart(2, "0");
        const day = String(selectedDate.getDate()).padStart(2, "0");

        taskDueDate.value = `${year}-${month}-${day}`;
        taskModal.hidden = false;
    });

    cancelTask.addEventListener("click", function () {
        taskModal.hidden = true;
    });
    // ===== Chuyển đổi Day / Week / Month =====
    const dayView = document.getElementById("day-view");
    const weekView = document.getElementById("week-view");
    const monthView = document.getElementById("month-view");

    const monthTitle = document.getElementById("month-title");
    const monthGrid = document.getElementById("month-grid");

    let displayedMonth = new Date(
        today.getFullYear(),
        today.getMonth(),
        1
    );

    let monthPopup = null;
    let popupHideTimer = null;

    function hideMonthPopup() {
        if (popupHideTimer) {
            clearTimeout(popupHideTimer);
            popupHideTimer = null;
        }

        if (monthPopup) {
            monthPopup.remove();
            monthPopup = null;
        }
    }

    function showMonthPopup(cell, date, tasks) {
        hideMonthPopup();

        // Không hiện popup nếu ngày không có task
        if (tasks.length === 0) return;

        const popup = document.createElement("div");
        popup.className = "month-task-popup";

        const heading = document.createElement("div");
        heading.className = "month-task-popup-heading";
        heading.textContent = date.toLocaleDateString("vi-VN", {
            weekday: "long",
            day: "2-digit",
            month: "2-digit",
            year: "numeric"
        });

        const count = document.createElement("div");
        count.className = "month-task-popup-count";
        count.textContent = `${tasks.length} công việc`;

        popup.append(heading, count);

        tasks.forEach(task => {
            const item = document.createElement("div");
            item.className = "month-task-popup-item";

            const title = document.createElement("div");
            title.className = "month-task-popup-title";
            title.textContent = task.title || "Không có tiêu đề";

            const details = document.createElement("div");
            details.className = "month-task-popup-details";

            const time = task.start_time && task.end_time
                ? `${task.start_time} – ${task.end_time}`
                : "Chưa có giờ";

            const status = Boolean(task.completed)
                ? "Đã hoàn thành"
                : "Chưa hoàn thành";

            details.textContent = `${time} · ${status}`;

            item.append(title, details);
            popup.appendChild(item);
        });

        document.body.appendChild(popup);
        monthPopup = popup;

        // Đặt popup gần ô ngày, tránh tràn khỏi màn hình
        const rect = cell.getBoundingClientRect();
        const popupRect = popup.getBoundingClientRect();

        let left = rect.left;
        let top = rect.bottom + 6;

        if (left + popupRect.width > window.innerWidth - 8) {
            left = window.innerWidth - popupRect.width - 8;
        }

        if (top + popupRect.height > window.innerHeight - 8) {
            top = rect.top - popupRect.height - 6;
        }

        popup.style.left = `${Math.max(8, left)}px`;
        popup.style.top = `${Math.max(8, top)}px`;

        popup.addEventListener("mouseenter", () => {
            if (popupHideTimer) {
                clearTimeout(popupHideTimer);
                popupHideTimer = null;
            }
        });

        popup.addEventListener("mouseleave", () => {
            popupHideTimer = setTimeout(hideMonthPopup, 150);
        });
    }

    function scheduleHideMonthPopup() {
        if (popupHideTimer) clearTimeout(popupHideTimer);

        popupHideTimer = setTimeout(hideMonthPopup, 150);
    }

    function renderMonth() {
        const year = displayedMonth.getFullYear();
        const month = displayedMonth.getMonth();

        monthTitle.textContent = new Date(year, month, 1)
            .toLocaleDateString("en-US", {
                month: "long",
                year: "numeric"
            });

        monthGrid.replaceChildren();

        // Bắt đầu từ thứ Hai của tuần chứa ngày đầu tháng
        const firstDay = new Date(year, month, 1);
        const offset = (firstDay.getDay() + 6) % 7;
        const startDate = new Date(year, month, 1 - offset);

        // Giữ bố cục 5 hàng theo thiết kế hiện tại
        for (let i = 0; i < 35; i++) {
            const date = new Date(startDate);
            date.setDate(startDate.getDate() + i);

            const key = dateKey(date);

            const cell = document.createElement("div");
            cell.className = "month-day";

            if (date.getMonth() !== month) {
                cell.classList.add("outside-month");
            }

            if (isSameDay(date, today)) {
                cell.classList.add("today");
            }

            if (isSameDay(date, selectedDate)) {
                cell.classList.add("selected");
            }

            const number = document.createElement("div");
            number.className = "month-day-number";
            number.textContent = date.getDate();
            cell.appendChild(number);

            // Lấy task có ngày đến hạn trùng với ô lịch
            const dayTasks = dbTasks.filter(
                task => task.due_date === key
            );

            cell.addEventListener("mouseenter", () => {
                showMonthPopup(cell, date, dayTasks);
            });

            cell.addEventListener("mouseleave", scheduleHideMonthPopup);


            // Chỉ hiển thị tối đa 2 task để giữ ô lịch gọn
            const visibleTasks = dayTasks.slice(0, 2);

            visibleTasks.forEach(task => {
                const badge = document.createElement("div");
                badge.className = "month-task";

                if (Boolean(task.completed)) {
                    badge.classList.add("is-completed");
                }

                const dot = document.createElement("span");
                dot.className = "month-task-dot";

                const colors = [
                    "#ff7185",
                    "#55c9f2",
                    "#7bdc87",
                    "#a78bfa",
                    "#fbbf65",
                    "#f472b6"
                ];

                dot.style.backgroundColor =
                    colors[Math.abs(Number(task.id) || 0) % colors.length];

                const title = document.createElement("span");
                title.className = "month-task-title";
                title.textContent = task.title;

                // Đưa mô tả vào tooltip khi rê chuột lên công việc
                badge.title = task.description
                    ? `${task.title}\n${task.description}`
                    : task.title;

                badge.append(dot, title);
                cell.appendChild(badge);
            });

            // Hiện số task chưa hiển thị
            if (dayTasks.length > visibleTasks.length) {
                const more = document.createElement("div");
                more.className = "month-task-more";
                more.textContent = `+${dayTasks.length - visibleTasks.length}`;
                cell.appendChild(more);
            }

            // Chọn ngày để đồng bộ với sidebar và Add task
            cell.addEventListener("click", () => {
                selectedDate = new Date(date);
                renderSidebarTasks();
                renderMonth();
            });

            monthGrid.appendChild(cell);
        }
    }
    const prevBtn = document.getElementById("prev-week");
    const nextBtn = document.getElementById("next-week");
    const todayBtn = document.getElementById("today");

    function refreshCurrentView() {
        if (currentView === "day") {
            renderDay();
        } else if (currentView === "week") {
            renderWeek();
        } else if (currentView === "month") {
            renderMonth();
        }

        renderSidebarTasks();
    }

    // Lùi một ngày, tuần hoặc tháng
    prevBtn.addEventListener("click", () => {
        if (currentView === "day") {
            selectedDate.setDate(selectedDate.getDate() - 1);
        } else if (currentView === "week") {
            weekOffset -= 1;
            selectedDate.setDate(selectedDate.getDate() - 7);
        } else if (currentView === "month") {
            displayedMonth.setMonth(displayedMonth.getMonth() - 1);
        }

        refreshCurrentView();
    });

    // Tiến một ngày, tuần hoặc tháng
    nextBtn.addEventListener("click", () => {
        if (currentView === "day") {
            selectedDate.setDate(selectedDate.getDate() + 1);
        } else if (currentView === "week") {
            weekOffset += 1;
            selectedDate.setDate(selectedDate.getDate() + 7);
        } else if (currentView === "month") {
            displayedMonth.setMonth(displayedMonth.getMonth() + 1);
        }

        refreshCurrentView();
    });

    // Quay về ngày hoặc tháng hiện tại
    todayBtn.addEventListener("click", () => {
        const now = new Date();

        today.setTime(now.getTime());
        today.setHours(0, 0, 0, 0);

        selectedDate = new Date(today);
        weekOffset = 0;

        displayedMonth = new Date(
            today.getFullYear(),
            today.getMonth(),
            1
        );

        refreshCurrentView();
    });
    // Khởi tạo lịch tháng
    renderMonth();

    setInterval(() => {
        const now = new Date();

        if (currentView === "month") {
            today.setTime(now.getTime());
            renderMonth();
        }
    }, 60 * 1000);
});
</script>
